services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data
    environment:
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    network_mode: host              # exposes on :19999
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./netdata/data:/var/lib/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    environment:
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  # OPTIONAL: enable when you're ready to test IDS
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host               # needed to sniff traffic
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/log:/var/log/suricata
      - ./suricata/rules:/var/lib/suricata/rules
    command: ["-i","eth0","-c","/etc/suricata/suricata.yaml","-D"]
    restart: unless-stopped
    # Uncomment the next line to actually start Suricata
    # depends_on: ["uptime-kuma","netdata"]
